name: eval

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'eval/**'
      - 'samples/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: run the full suite with ablations
        type: boolean
        default: false

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    # secrets are not exposed to pull requests from forks; skip instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsense
          POSTGRES_PASSWORD: docsense
          POSTGRES_DB: docsense
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docsense -d docsense"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://docsense:docsense@localhost:5432/docsense
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - name: fast subset with thresholds (every pull request)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full)
        run: npm run run:ci -w eval
      - name: full suite with ablations (weekly)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: npm run run -w eval -- --ablations --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
