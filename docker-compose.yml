services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docsense-postgres
    environment:
      POSTGRES_USER: docsense
      POSTGRES_PASSWORD: docsense
      POSTGRES_DB: docsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsense -d docsense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
